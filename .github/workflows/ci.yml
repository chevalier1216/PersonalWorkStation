name: V1 verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer through Windows PowerShell 5.1 -File
        shell: cmd
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File scripts\Install-CodexIssueWorkerTask.ps1 -ValidateOnly
      - name: Resolve Codex command shim through installer preflight
        shell: powershell
        run: |
          $shim = Join-Path $env:RUNNER_TEMP 'codex-command-shim'
          New-Item -ItemType Directory -Path $shim -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $shim 'codex.cmd') -Value '@echo off' -Encoding Ascii
          $env:PATH = "$shim;$env:PATH"
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File scripts\Install-CodexIssueWorkerTask.ps1 `
            -RepositoryRoot $PWD `
            -SkipGitHubSetup `
            -WhatIf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migration files guard
        run: npm run check:migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
